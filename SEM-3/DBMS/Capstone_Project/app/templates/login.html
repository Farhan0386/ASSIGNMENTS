{% extends 'base.html' %}
{% block title %}Sign in · PayTrack{% endblock %}
{% block content %}
<section class="login-wrap">
  <div class="login-card">
    <p class="eyebrow">PAYROLL & ATTENDANCE</p>
    <h1>Sign in to PayTrack</h1>
    <p class="muted">Use your HR/Admin or employee account.</p>
    <form method="post" class="form-grid">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Username<input name="username" autocomplete="username" required autofocus></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="button" type="submit">Sign in</button>
    </form>
    <div class="demo-credentials">
      <strong>Local demo accounts</strong>
      <span>HR/Admin: <code>admin</code> / <code>Admin@123</code></span>
      <span>Employee: <code>e1001</code> / <code>Employee@123</code></span>
    </div>
  </div>
</section>
{% endblock %}
